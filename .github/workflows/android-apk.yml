name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest www/
          cp -r icons www/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          # landscape, like the game
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
          # use the Meow Nest icon
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp icons/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp icons/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cd android/app/build/outputs/apk/release
          $BT/zipalign -p -f 4 app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks "$GITHUB_WORKSPACE/release.keystore" \
            --ks-key-alias meownest --ks-pass pass:meownest123 --key-pass pass:meownest123 \
            --out "$GITHUB_WORKSPACE/MeowNest.apk" aligned.apk
          $BT/apksigner verify --verbose "$GITHUB_WORKSPACE/MeowNest.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MeowNest-apk
          path: MeowNest.apk
